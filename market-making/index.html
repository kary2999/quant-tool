<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MX 铺单盒子</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css"
        integrity="sha384-HSMxcRTRxnN+Bdg0JdbxYKrThecOKuH5zCYotlSAcp1+c8xmyTe9GYg1l9a69psu" crossorigin="anonymous">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap-theme.min.css"
        integrity="sha384-6pzBo3FDv/PJ8r2KRkGHifhEocL+1X2rVCTTkUfGk7/0pbek5mMa1upzvWbrUbOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css">
  <script src="https://code.jquery.com/jquery-3.6.4.min.js"
          integrity="sha256-oP6HI9z1XaZNBrJURtCoUT5SUnxFr8s3BzRl+cbzUq8=" crossorigin="anonymous"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"
          integrity="sha384-aJ21OjlMXNL5UyIl/XNwTMqvzeRMZH2w8c5cRVpzpU8Y5bApTppSuUkhZXN0VxHd"
          crossorigin="anonymous"></script>
  <script src="https://static.topcreditbank.com/2023/0719/highcharts.js"></script>
  <script src="https://static.topcreditbank.com/2023/0719/exporting.js"></script>
  <script src="https://static.topcreditbank.com/2023/0719/zh_cn-1.4.0.min.js"></script>
  <script src="https://static.topcreditbank.com/2023/0719/w72sHD1689763738672.js"></script>
  <script src="../config/config-loader.js"></script>
  <script src="js/calculation.js"></script>
  <style>
    body { background: #f1f4f6; }
    .red { color: rgba(222, 57, 57, 0.99); }
    .green { color: green; }
    .blue { color: blue; }
    .orange { color: #ff6200; }
    .white { color: #333; }

    #depth_panel {
      background: #fff;
      border-bottom: 1px solid #ddd;
      margin-bottom: 0;
    }
    #container {
      width: 100%;
      height: 400px;
      padding: 4px 8px 0;
    }
    .depth-controls {
      padding: 8px 12px;
      background-color: rgba(29, 237, 12, 0.1);
      overflow: hidden;
    }
    .depth-controls .form-control {
      display: inline-block;
      width: auto;
      vertical-align: middle;
      margin-right: 8px;
    }
    #stats_info {
      display: inline-block;
      vertical-align: middle;
      font-size: 15px;
      margin-left: 12px;
    }

    .panel-box { margin: 0; border-radius: 0; border: none; box-shadow: none; }
    .panel-box > .panel-body { padding: 0 8px 12px; }
    #toolbar { padding: 8px 4px; }
    #box_table th {
      text-align: center;
      font-size: 12px;
      white-space: nowrap;
    }
    #box_table td {
      text-align: center;
      font-size: 12px;
      vertical-align: middle !important;
    }
    #box_table .price-abs { font-size: 15px; }
    .table-hover > tbody > tr:hover {
      background-color: rgba(50, 158, 236, 0.34) !important;
    }

    .config-panel {
      margin: 0;
      border-radius: 0;
      border-top: 1px dashed #ccc;
    }
    .config-panel .panel-heading { padding: 6px 12px; cursor: pointer; background: #fafafa; }
    .config-panel .panel-body { padding: 10px 12px; font-size: 12px; }
    .config-panel label { font-weight: normal; margin-right: 12px; }
  </style>
</head>
<body>

<!-- 深度图（原 depthchat iframe 内容） -->
<div id="depth_panel">
  <div id="container"></div>
  <input type="hidden" id="depth_analyze" value="">
  <div class="depth-controls">
    <input type="text" id="symbol_id" class="form-control" value="1000001"
           placeholder="交易对ID" style="width:90px;">
    <select id="market_monitor" class="form-control" style="width:120px;">
      <option value="https://contract.hxexchge.com/debug/depth">DEV1环境</option>
      <option value="https://contract.chishee.com/debug/depth">生产环境</option>
    </select>
    <div id="stats_info"></div>
  </div>
</div>

<!-- 铺单表格（原 mx_market_making_box/index） -->
<div class="panel panel-default panel-box">
  <div class="panel-body">
    <div id="toolbar" class="toolbar">
      <a href="javascript:;" class="btn btn-primary btn-refresh" title="刷新">
        <i class="fa fa-refresh"></i>
      </a>
      <a href="javascript:;" class="btn btn-success btn-add" title="添加" style="visibility:hidden">
        <i class="fa fa-plus"></i> 添加
      </a>
      <span class="text-muted" style="margin-left:8px;font-size:12px;">
        配置: <span id="data_file_label">symbol-1000001.json</span>
      </span>
    </div>
    <div class="table-responsive">
      <table id="box_table" class="table table-striped table-bordered table-hover table-nowrap">
        <thead>
          <tr>
            <th>PID</th>
            <th>方向</th>
            <th>层</th>
            <th>固笔数</th>
            <th>价格区间</th>
            <th>固量区间</th>
            <th>变笔数</th>
            <th>变量区间</th>
            <th>过期时间</th>
            <th>开关</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="box_tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 外部配置（折叠，不影响原界面） -->
<div class="panel panel-default config-panel">
  <div class="panel-heading" data-toggle="collapse" data-target="#cfg_body">
    <i class="fa fa-cog"></i> 高级 · 外部配置
    <span class="pull-right fa fa-chevron-down"></span>
  </div>
  <div id="cfg_body" class="panel-collapse collapse">
    <div class="panel-body">
      <label>Mark 价格（接口不可用时手动）:
        <input type="text" id="mark_price_input" class="form-control input-sm" style="width:120px;display:inline-block" value="">
      </label>
      <label>加载 JSON:
        <input type="file" id="data_file" accept=".json" class="input-sm">
      </label>
      <label><input type="checkbox" id="use_mock"> 使用 mock 深度数据</label>
    </div>
  </div>
</div>

<script src="js/depth.js"></script>
<script src="js/table.js"></script>
<script src="js/app.js"></script>
</body>
</html>
